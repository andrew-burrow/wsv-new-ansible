#
# :Precis: Set role parameters common to all hosts in the AZURE cluster
# :Authors: Andrew Burrow
# :Contact: andrew.burrow@syntegrity.com.au
#

---

#
# From `/roles/ibm_mq_host_define/defaults/main.yml`

# Base directory
#
# What is the filename prefix for IBM MQ software installation directories?
ibm_mq_host_base_dir: /opt/ibm

# Daemon user and groups
#
# What is the name and UID of the account to run the daemon?  What is
# the name and GID of the primary group of the daemon?  Which
# administrative users should be added to the primary group of the
# daemon?
ibm_mq_host_user: mqm
ibm_mq_host_uid: 5000
ibm_mq_host_group: mqm
ibm_mq_host_gid: 5000
ibm_mq_host_users: []

# System resource limits for mqm user
#
# What are the soft and hard limits for open files (nofile) and processes
# (nproc) for the mqm user?  These go in /etc/security/limits.conf.
ibm_mq_host_nofile: 10240
ibm_mq_host_nproc: 4096

# Brokers group
#
# What is the name of the group for integration brokers? This group
# provides shared access between MQ and ACE components.
ibm_mq_host_brokers_group: mqbrkrs

# Brokers group GID
#
# What is the GID for the mqbrkrs secondary group?  If not specified, the
# system will auto-assign.
ibm_mq_host_brokers_gid: 5002

# Version of itsshelpers repository to deploy
#
# Which branch/commit/tag of the itsshelper Git repository is aligned with
# this repository?
ibm_mq_host_itsshelper_version: eip_ansible_app

#
# From `/roles/ibm_ace_host_define/defaults/main.yml`

# Base directory
#
# What is the filename prefix for IBM ACE software installation directories?
ibm_ace_host_base_dir: /opt/ibm

# Daemon user and groups
#
# What is the name and UID of the account to run ACE?  What is the name
# and GID of the primary group?  Which additional groups should the user
# belong to?  Which administrative users should be added to the primary
# group?
ibm_ace_host_user: aceadmin
ibm_ace_host_uid: 5001
ibm_ace_host_group: mqbrkrs
ibm_ace_host_gid: 5001
ibm_ace_host_additional_groups:
  - mqm
ibm_ace_host_users: []

# Mount points to create on the host
#
# What are the NFS and CIFS mount points required by this host?  The
# specifications comprise a list of objects that define the following keys:
#
# - `mount_point` -- What is the local mount point path?
# - `type` -- What is the filesystem type?  Either `nfs` or `cifs`.
# - `server` -- What is the remote server address and export path?
#   For NFS: `SERVER:/export/path`
#   For CIFS: `//SERVER/share`
# - `options` -- What are the mount options?  A string of comma-separated
#   options as they would appear in fstab.  Do not include the credentials
#   option here; it is derived from `credential_file`.
# - `uid` -- What local user should own the mount?  (CIFS only)
# - `gid` -- What local group should own the mount?  (CIFS only)
# - `credential_file` -- What is the path to the credential file?  (CIFS
#   only)  Typically `/usr/local/.auth/{SERVER}.auth`.
# - `credential_secret` -- What are the contents of the credential file?
#   (CIFS only)  A string in the format:
#
#     username=DOMAIN\user
#     password=secret
#
# VAULT NAMING CONVENTIONS:
#
# - `.ibm_ace_host_mounts[].credential_secret`
#
#   Use `vault_ibm_ace_host_mounts_{NAME}_secret` where `{NAME}` is a
#   short identifier for the server, e.g. `SDWFTP0101` or `alert_dev`.
#   Note that one credential file typically serves multiple mount points
#   sharing the same server.
#
ibm_ace_host_mounts: []
