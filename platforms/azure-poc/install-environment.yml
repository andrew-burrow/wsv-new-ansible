#
# :Precis: Install complete IBM MQ and ACE environment on hosts
# :Authors: Andrew Burrow
# :Contact: andrew.burrow@syntegrity.com.au
#

---

- name: Install IBM MQ and ACE environment on hosts
  hosts: all
  gather_facts: false
  roles:
    - ibm_host_define
    - ibm_mq_host_define
    - ibm_ace_host_define
    - ibm_mq_environment_define
    - ibm_ace_environment_define
    - ibm_mq_environment_install
    - ibm_ace_environment_install
