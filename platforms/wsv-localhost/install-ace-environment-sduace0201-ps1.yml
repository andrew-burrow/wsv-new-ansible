#
# :Precis: Install IBM ACE environment on localhost
# :Authors: Andrew Burrow
# :Contact: andrew.burrow@syntegrity.com.au
#

---

- name: Install IBM ACE environment
  hosts: localhost
  become: true
  gather_facts: false

  vars:
    # FROM ibm_ace_host_define
    #
    # NOTE: these values must be IDENTICAL to the values in
    # setup-ace-host-{HOST}.yml.  They are repeated here, so that the action
    # roles such as ibm_ace_environment_install can make use of them, e.g., to
    # chmod a folder so that the MQ account can write to it

    # Daemon user and groups
    #
    # What is the name and UID of the account to run ACE?  What is the name
    # and GID of the primary group?  Which additional groups should the user
    # belong to?  Which administrative users should be added to the primary
    # group?
    ibm_ace_host_user: aceadmin
    ibm_ace_host_uid: 10778
    ibm_ace_host_group: mqbrkrs
    ibm_ace_host_gid: 10778
    ibm_ace_host_additional_groups:
      - mqm
    ibm_ace_host_users: []

    # FROM ibm_ace_environment_define
    #

    # Base directory
    #
    # What is the filename prefix for IBM ACE software installation directories?
    ibm_ace_host_base_dir: /opt/ibm

    # Environment identifier
    #
    # What is the short name for this environment?  This is used in directory
    # paths and integration node names.  Examples: sx1, ts1, ts2, prod
    ibm_ace_environment: ps1

    # ACE version and package
    #
    # What version of IBM App Connect Enterprise are we installing?  What is
    # the filename of the installation package?  Where is it located?
    ibm_ace_environment_version: "13.0.6.2"
    ibm_ace_environment_package: "13.0-ACE-LINUXX64-13.0.6.2.tar.gz"
    ibm_ace_environment_source_dir: /opt/ibm-software/ace13

    # Work path for integration nodes
    #
    # Where should integration node working directories be created?  This path
    # is passed to mqsicreatebroker with -w flag.
    ibm_ace_environment_work_path: "/var/mqsi/{{ ibm_ace_environment }}"
    ibm_ace_operation_mode: "Development"
    ibm_ace_host: "10.51.35.77"
    ibm_ace_host_auth_mode: "active"
    ibm_ace_host_auth_mode_user: "admin"
    ibm_ace_host_auth_mode_pwd: "passw0rd"
    ibm_ace_host_auth_mode_role: "admin"
    ibm_ace_vault: "Cheid7eiX3"    

    # Integration nodes to create
    #
    # List of integration nodes to create in this environment.  Each entry
    # specifies the node name, associated queue manager, and HTTP port.
    ibm_ace_environment_integration_nodes:
      - name: ACEPS1J0201
        queue_manager: APS1J0201
        port: 4543
        credentials:
        - name: TEMPUS
          type: odbc
          user: DEV1S_TPC2
          pass: Dev_1s_Tpc2          
        - name: EIP
          type: odbc
          user: DEV1S_IIBCFG
          pass: DeV_c1g_d5          
        - name: ACCTIONR
          type: odbc
          user: esb_readDB
          pass: esb_rD$4DeVb        
        - name: ACCTIONR_EVENT
          type: odbc
          user: eip_wrteDB
          pass: eIp_WR$4DeVb          
        - name: PCS
          type: odbc
          user: pcs_user
          pass: P6c_Us3r_jbxq          
        - name: PCS_CFG
          type: odbc
          user: pcs_cfg_user
          pass: P6sd_c5g_Us3r
        integration_servers:
        - name: IS-ps1-common
          port: 7601
          jre_version: 8
        - name: IS-ps1-tac
          port: 7602
          jre_version: 8
        - name: IS-ps1-vwa
          port: 7603
          jre_version: 8     
      - name: ACEPS1I0201
        queue_manager: APS1I0201
        port: 4443
        credentials:
        - name: TEMPUS
          type: odbc
          user: DEV1S_TPC2
          pass: Dev_1s_Tpc2         
        - name: EIP
          type: odbc
          user: DEV1S_IIBCFG
          pass: DeV_c1g_d5          
        - name: ACCTIONR
          type: odbc
          user: esb_readDB
          pass: esb_rD$4DeVb        
        - name: ACCTIONR_EVENT
          type: odbc
          user: eip_wrteDB
          pass: eIp_WR$4DeVb          
        - name: PCS
          type: odbc
          user: pcs_user
          pass: P6c_Us3r_jbxq          
        - name: PCS_CFG
          type: odbc
          user: pcs_cfg_user
          pass: P6sd_c5g_Us3r                          
        integration_servers:
        - name: IS-ps1-common
          port: 7501
          jre_version: 8
        - name: IS-ps1-tac
          port: 7502
          jre_version: 8
        - name: IS-ps1-vwa
          port: 7503
          jre_version: 8     
    ibm_mq_host_brokers_group: mqbrkrs

    # SSL certificate configuration
    #
    # What is the filename of the P12 certificate file?  What is its password?
    # The certificate file should be in the source directory.
    ibm_ace_environment_cert_p12: sduace0201.services.workcover.vic.gov.au.p12
    ibm_ace_environment_cert_password: "thai3HaiXuuph9i"

  roles:
    - ibm_ace_host_define
    - ibm_ace_environment_define
    - ibm_ace_environment_install
