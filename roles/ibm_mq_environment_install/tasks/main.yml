#
# :Precis: Install an IBM MQ environment on the host
# :Authors: Andrew Burrow
# :Contact: andrew.burrow@syntegrity.com.au
#

---

- name: Install rpm-build package
  become: true
  ansible.builtin.dnf:
    name: rpm-build
    state: present

# MQ Base Installation

- name: Create MQ base build directory
  become: true
  ansible.builtin.file:
    path: "{{ ibm_mq_environment_build_dir }}/base"
    state: directory
    mode: '0755'

- name: Extract MQ base installer
  become: true
  ansible.builtin.unarchive:
    src: "{{ ibm_mq_environment_source_dir }}/{{ ibm_mq_environment_package }}"
    dest: "{{ ibm_mq_environment_build_dir }}/base"
    remote_src: true
    creates: "{{ ibm_mq_environment_build_dir }}/base/MQServer"

- name: Create MQ package for environment
  become: true
  ansible.builtin.command:
    cmd: ./crtmqpkg {{ ibm_mq_environment }}
    chdir: "{{ ibm_mq_environment_build_dir }}/base/MQServer"
    creates: >-
      {{ ibm_mq_environment_build_dir }}/base/MQServer/mq_rpms/{{ ibm_mq_environment }}
  environment:
    TMPDIR: "{{ ibm_mq_environment_build_dir }}/base/MQServer"

- name: Install MQ base RPMs
  become: true
  ansible.builtin.shell:
    cmd: |
      rpm --prefix={{ ibm_mq_host_base_dir }}/{{ ibm_mq_environment }}/mqm \
          -ivh MQSeriesRuntime*.rpm MQSeriesJRE*.rpm MQSeriesGSKit*.rpm \
               MQSeriesClient*.rpm MQSeriesJava*.rpm MQSeriesMan*.rpm \
               MQSeriesSample*.rpm MQSeriesSDK*.rpm MQSeriesServer*.rpm \
               MQSeriesWeb*.rpm
    chdir: >-
      {{
        ibm_mq_environment_build_dir
      }}/base/MQServer/mq_rpms/{{ ibm_mq_environment }}/x86_64
    creates: >-
      {{ ibm_mq_host_base_dir }}/{{ ibm_mq_environment }}/mqm/bin/mqlicense

- name: Accept MQ license
  become: true
  ansible.builtin.command:
    cmd: ./mqlicense -accept
    chdir: "{{ ibm_mq_host_base_dir }}/{{ ibm_mq_environment }}/mqm/bin"
    creates: >-
      {{ ibm_mq_host_base_dir }}/{{ ibm_mq_environment }}/mqm/.license_accepted

- name: Change environment folder permissions
  become: true
  ansible.builtin.file:
    path: "{{ ibm_mq_host_base_dir }}/{{ ibm_mq_environment }}"
    mode: '0755'
    state: directory

# MQ Fixpack Installation

- name: Create MQ fixpack build directory
  become: true
  ansible.builtin.file:
    path: "{{ ibm_mq_environment_build_dir }}/fixpack"
    state: directory
    mode: '0755'

- name: Extract MQ fixpack
  become: true
  ansible.builtin.unarchive:
    src: "{{ ibm_mq_environment_source_dir }}/{{ ibm_mq_environment_fixpack_package }}"
    dest: "{{ ibm_mq_environment_build_dir }}/fixpack"
    remote_src: true
    creates: "{{ ibm_mq_environment_build_dir }}/fixpack/crtmqfp"

- name: Create MQ fixpack package
  become: true
  ansible.builtin.command:
    cmd: ./crtmqfp {{ ibm_mq_environment }}
    chdir: "{{ ibm_mq_environment_build_dir }}/fixpack"
    creates: "{{ ibm_mq_environment_build_dir }}/fixpack/mq_rpms/{{ ibm_mq_environment }}"
  environment:
    TMPDIR: "{{ ibm_mq_environment_build_dir }}/fixpack"

- name: Install MQ fixpack RPMs
  become: true
  ansible.builtin.shell:
    cmd: |
      rpm --prefix={{ ibm_mq_host_base_dir }}/{{ ibm_mq_environment }}/mqm \
          -Uvh MQSeriesRuntime*.rpm MQSeriesJRE*.rpm MQSeriesGSKit*.rpm \
               MQSeriesClient*.rpm MQSeriesJava*.rpm MQSeriesMan*.rpm \
               MQSeriesSample*.rpm MQSeriesSDK*.rpm MQSeriesServer*.rpm \
               MQSeriesWeb*.rpm
    chdir: >-
      {{ ibm_mq_environment_build_dir }}/fixpack/mq_rpms/{{ ibm_mq_environment }}/x86_64
  register: fixpack_install
  changed_when: "'Upgrading' in fixpack_install.stdout or 'Installing' in fixpack_install.stdout"
  failed_when:
    - fixpack_install.rc != 0
    - "'is already installed' not in fixpack_install.stderr"

# Queue Manager Creation

- name: Create /var/mqm folder
  become: true
  ansible.builtin.file:
    path: "/var/mqm"
    owner: "{{ ibm_mq_host_user }}"
    group: "{{ ibm_mq_host_group }}"
    mode: 'u=rwx,g=rwx,o=rx'
    state: directory

- name: Create /var/mqm queue manager folders
  become: true
  ansible.builtin.file:
    path: "/var/mqm/qmgrs/{{ item.queue_manager }}"
    owner: "{{ ibm_mq_host_user }}"
    group: "{{ ibm_mq_host_group }}"
    mode: 'u=rwx,g=rwxs,o=rx'
    state: directory
  loop: "{{ ibm_mq_environment_itsshelper_qmgr_props }}"

- name: Create /var/mqm queue manager SSL folders with restricted permissions
  become: true
  ansible.builtin.file:
    path: "/var/mqm/qmgrs/{{ item.queue_manager }}/ssl"
    owner: "{{ ibm_mq_host_user }}"
    group: "{{ ibm_mq_host_group }}"
    mode: 'u=rwx,g=rwxs'
    state: directory
  loop: "{{ ibm_mq_environment_itsshelper_qmgr_props }}"

- name: Install queue manager certificate stores
  become: true
  ansible.builtin.copy:
    src: >-
      {{ ibm_mq_environment_source_dir }}/ssl_kdb/{{
        item.0.queue_manager
      }}/{{ item.0.queue_manager }}.{{ item.1 }}
    dest: >-
      /var/mqm/qmgrs/{{ item.0.queue_manager }}/ssl/keys.{{ item.1 }}
    remote_src: true
    owner: "{{ ibm_mq_host_user }}"
    group: "{{ ibm_mq_host_group }}"
    mode: 'u=rw,g=rw'
  loop: "{{ ibm_mq_environment_itsshelper_qmgr_props | product(['kdb', 'rdb', 'sth', 'crl']) | list }}"

- name: Collate status of each queue manager
  become: true
  become_user: "{{ ibm_mq_host_user }}"
  ansible.builtin.command:
    cmd: "dspmq -m {{ item.queue_manager }}"
  environment:
    PATH: >-
      {{ ibm_mq_host_base_dir }}/{{
        ibm_mq_environment
      }}/mqm/bin:/usr/local/bin:/usr/bin:/bin
  register: dspmq_check
  failed_when: false
  changed_when: false
  loop: "{{ ibm_mq_environment_itsshelper_qmgr_props }}"

- name: Create each non-existent queue manager via itsshelper
  become: true
  ansible.builtin.command:
    cmd: >-
      /opt/scripts/createQMGR.bash
      {{ ibm_mq_environment }}
      {{ result.item.name }}
  environment:
    PATH: >-
      {{ ibm_mq_host_base_dir }}/{{
        ibm_mq_environment
      }}/mqm/bin:/usr/local/bin:/usr/bin:/bin
  loop: "{{ dspmq_check.results }}"
  loop_control:
    loop_var: result
    label: "{{ result.item.queue_manager }}"
  when: "'AMQ7048E' in result.stderr"

- name: Start queue managers
  become: true
  become_user: "{{ ibm_mq_host_user }}"
  ansible.builtin.command:
    cmd: strmqm {{ item.queue_manager }}
  environment:
    PATH: >-
      {{ ibm_mq_host_base_dir }}/{{
        ibm_mq_environment
      }}/mqm/bin:/usr/local/bin:/usr/bin:/bin
  register: start_qm
  changed_when: "'started' in start_qm.stdout"
  failed_when:
    - start_qm.rc != 0
    - "'already running' not in start_qm.stderr"
    - "'queue manager running' not in start_qm.stderr"
  loop: "{{ ibm_mq_environment_itsshelper_qmgr_props }}"

- name: Configure MQ application queues via itsshelper
  become: true
  ansible.builtin.command:
    cmd: >-
      /opt/scripts/createMQApp.bash
      {{ ibm_mq_environment }}
      {{ item.name }}
    creates: >-
      /opt/properties/{{ ibm_mq_environment }}_{{ item.qmtype }}_{{ item.name }}.mqsc
  environment:
    PATH: >-
      {{ ibm_mq_host_base_dir }}/{{
        ibm_mq_environment
      }}/mqm/bin:/usr/local/bin:/usr/bin:/bin
  loop: "{{ ibm_mq_environment_itsshelper_mqapp_props }}"

# User Configuration

- name: Configure mqm user aliases
  become: true
  ansible.builtin.blockinfile:
    path: "/home/{{ ibm_mq_host_user }}/.bashrc"
    block: >-
      alias {{
        ibm_mq_environment
      }}=". {{
        ibm_mq_host_base_dir
      }}/{{ ibm_mq_environment }}/mqm/bin/setmqenv -s"
    marker: "# {mark} ANSIBLE MANAGED MQ ALIASES FOR {{ ibm_mq_environment }}"
    create: true
    owner: "{{ ibm_mq_host_user }}"
    group: "{{ ibm_mq_host_group }}"
    mode: '0644'
