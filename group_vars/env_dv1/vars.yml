#
# :Precis: Set role parameters for the EIP DV1 environment
# :Authors: Andrew Burrow
# :Contact: andrew.burrow@syntegrity.com.au
#

---

#
# From `/roles/ibm_mq_environment_define/defaults/main.yml`

# Base directory
#
# What is the filename prefix for IBM MQ software installation directories?
ibm_mq_environment_base_dir: /opt/ibm

# Environment identifier
#
# What is the short name for this environment?  This is used in directory
# paths and queue manager names.  Examples: sx1, ts1, ts2, prod
ibm_mq_environment: dv1

# MQ version and package
#
# What version of IBM MQ are we installing?  What is the filename of the
# installation package?  Where is it located?
ibm_mq_environment_version: "9.3.0.2"
ibm_mq_environment_package: "IBM_MQ_9.3.0.2_LINUX_X86-64.tar.gz"
ibm_mq_environment_source_dir: /opt/ibm-software/mq

# Build directory for RPM creation
#
# Where should we create the ephemeral workspace for building custom RPMs?
# This directory can be deleted after installation.
ibm_mq_environment_build_dir: "/var/tmp/{{ ibm_mq_environment }}/mq-build"

# MQ fixpack version and package
#
# What fixpack level should be applied?  What is the filename of the
# fixpack package?
ibm_mq_environment_fixpack_version: "9.3.0.16"
ibm_mq_environment_fixpack_package: "9.3.0-IBM-MQ-LinuxX64-FP0016.tar.gz"

# Queue managers to create
#
# What is the list of queue managers to create on each host in the
# environment?  The specifications comprise a list of objects that define the
# following keys:
#
# - `name` -- What is the host-specific name of the queue manager?
# - `log_size` -- What is the log file size?
#
# HOST OVERRIDE CONVENTIONS:
#
# - The `name` value is environment-specific AND host-specific
# - The host specific value is computed at task execution time from an
#   expression that uses `ibm_host_index`
# - The variable SHOULD NOT and NEED NOT be overridden in the host variables
#   IF expressed in terms of `ibm_host_index`
ibm_mq_environment_queue_managers:
  - name: "ADV1J{{ ibm_host_index }}"
    log_size: 65535
  - name: "ADV1I{{ ibm_host_index }}"
    log_size: 65535

#
# From `/roles/ibm_ace_environment_define/defaults/main.yml`

# Environment identifier
#
# What is the short name for this environment?  This is used in directory
# paths and integration node names.  Examples: sx1, ts1, ts2, prod
ibm_ace_environment: dv1

# ACE version and package
#
# What version of IBM App Connect Enterprise are we installing?  What is
# the filename of the installation package?  Where is it located?
ibm_ace_environment_version: "13.0.6.2"
ibm_ace_environment_package: "13.0-ACE-LINUXX64-13.0.6.2.tar.gz"
ibm_ace_environment_source_dir: /opt/ibm-software/ace13

# Work path for integration nodes
#
# Where should integration node working directories be created?  This path
# is passed to mqsicreatebroker with -w flag.
ibm_ace_environment_work_path: "/var/mqsi/{{ ibm_ace_environment }}"

# Root directory for file nodes
#
# What is the *absolute* path to the root directory used by ACE message flow
# nodes that read from and write to the filesystem?
#
# - In Ansible, set this value AND use it to define environment-specific
#   directory paths and symbolic links in `ibm_ace_environment_directories`.
# - In ACE, EITHER set `rootDirectory` configuration to match OR ensure
#   absolute paths in the flow configuration match.
ibm_ace_environment_root_dir: "/var/ace/{{ ibm_ace_environment }}/FILENODES_ROOT_DIR"

# Integration nodes to create
#
# What are the specifications of the integration nodes defined in this
# environment?  The specifications comprise a list of objects that define the
# following keys:
#
# - `name` -- What is the name of the node?
# - `queue_manager` -- What is the name of the associated queue manager?
# - `webadmin_port` -- What is the port number of the web admin for the node?
# - `webadmin_secret` -- What is the secret for the web admin interface?
# - `credentials` --  What credentials does the node require?  The credentials
#   are a list of objects, each defining the following keys:
#
#   - `name` -- What is the name of the credential?
#   - `type` -- What is the type of the credential?
#   - `username` -- What is the username in the credential?
#   - `secret` -- What is the password in the credential?
#
# - `integration_servers` --  What integration servers does the node define?
#   The servers are a list of objects, each defining the following keys:
#
#   - `name` -- What is the name of the server?
#   - `port` -- What port does the server listen on?
#   - `jre_version` -- What JRE version does the server run?
#   - `cache_port` -- What port does the integration server listen on to
#     allow other integration servers to read from its embedded cache?
#
# HOST OVERRIDE CONVENTIONS:
#
# - The `name` and `queue_manager` values are environment-specific AND
#   host-specific
# - The host specific value is computed at task execution time from an
#   expression that uses `ibm_host_index`
# - The variables SHOULD NOT and NEED NOT be overridden in the host variables
#   IF expressed in terms of `ibm_host_index`
#
# VAULT NAMING CONVENTIONS:
#
# - `.ibm_ace_environment_integration_nodes[].webadmin_secret`
#
#   Use `vault_ibm_ace_webadmin_secret`, and note that this indicates the
#   webadmin secret is not node-specific
#
# - `.ibm_ace_environment_integration_nodes[].credentials[].secret`
#
#   Use `vault_ibm_ace_credentials_{CRED_NAME}_secret` where `{CRED_NAME}` is
#   the value of `name` on the credential item, and note that this indicates
#   the credential secret is not node-specific
ibm_ace_environment_integration_nodes:
  - name: "ACEDV1J{{ ibm_host_index }}"
    queue_manager: "ADV1J{{ ibm_host_index }}"
    webadmin_port: 4543
    webadmin_secret: "{{ vault_ibm_ace_webadmin_secret }}"
    credentials:
    - name: TEMPUS
      type: odbc
      username: DEV1S_TPC2
      secret: "{{ vault_ibm_ace_credentials_TEMPUS_secret }}"
    - name: EIP
      type: odbc
      username: DEV1S_IIBCFG
      secret: "{{ vault_ibm_ace_credentials_EIP_secret }}"
    - name: ACCTIONR
      type: odbc
      username: esb_readDB
      secret: "{{ vault_ibm_ace_credentials_ACCTIONR_secret }}"
    - name: ACCTIONR_EVENT
      type: odbc
      username: eip_wrteDB
      secret: "{{ vault_ibm_ace_credentials_ACCTIONR_EVENT_secret }}"
    - name: PCS
      type: odbc
      username: pcs_user
      secret: "{{ vault_ibm_ace_credentials_PCS_secret }}"
    - name: PCS_CFG
      type: odbc
      username: pcs_cfg_user
      secret: "{{ vault_ibm_ace_credentials_PCS_CFG_secret }}"
    integration_servers:
    - name: IS-dv1-common
      port: 7601
      jre_version: 8
      cache_port: 7901
    - name: IS-dv1-tac
      port: 7602
      jre_version: 8
      cache_port: 7902
    - name: IS-dv1-vwa
      port: 7603
      jre_version: 8
      cache_port: 7903
  - name: "ACEDV1I{{ ibm_host_index }}"
    queue_manager: "ADV1I{{ ibm_host_index }}"
    webadmin_port: 4443
    webadmin_secret: "{{ vault_ibm_ace_webadmin_secret }}"
    credentials:
    - name: TEMPUS
      type: odbc
      username: DEV1S_TPC2
      secret: "{{ vault_ibm_ace_credentials_TEMPUS_secret }}"
    - name: EIP
      type: odbc
      username: DEV1S_IIBCFG
      secret: "{{ vault_ibm_ace_credentials_EIP_secret }}"
    - name: ACCTIONR
      type: odbc
      username: esb_readDB
      secret: "{{ vault_ibm_ace_credentials_ACCTIONR_secret }}"
    - name: ACCTIONR_EVENT
      type: odbc
      username: eip_wrteDB
      secret: "{{ vault_ibm_ace_credentials_ACCTIONR_EVENT_secret }}"
    - name: PCS
      type: odbc
      username: pcs_user
      secret: "{{ vault_ibm_ace_credentials_PCS_secret }}"
    - name: PCS_CFG
      type: odbc
      username: pcs_cfg_user
      secret: "{{ vault_ibm_ace_credentials_PCS_CFG_secret }}"
    integration_servers:
    - name: IS-dv1-common
      port: 7501
      jre_version: 8
      cache_port: 7801
    - name: IS-dv1-tac
      port: 7502
      jre_version: 8
      cache_port: 7802
    - name: IS-dv1-vwa
      port: 7503
      jre_version: 8
      cache_port: 7803

# Integration node vault secret
#
# What is the secret used to encrypt the vault in which the integration nodes
# store secrets?  This value is used in common across all integration nodes in
# an environment.
#
# VAULT NAMING CONVENTIONS:
#
# - `.ibm_ace_environment_vault_secret`
#
#   Use `vault_ibm_ace_vault_secret`
ibm_ace_environment_vault_secret: "{{ vault_ibm_ace_vault_secret }}"

# Integration web admin configuration
#
# Is basic authentication on the web admin interface 'active' or 'inactive'?
# What is the username, and role of the login on the web admin interface?
# These values are used in common across all integration nodes in the
# environment
ibm_ace_environment_webadmin_mode: active
ibm_ace_environment_webadmin_user: admin
ibm_ace_environment_webadmin_role: admin

# Integration web admin IP address
#
# What is the hostname or IP address of the web admin interface?  This value
# is common across all integration nodes.  See
# `ibm_ace_environment_integration_nodes` for the node-specific port number
# and password
#
# HOST OVERRIDE CONVENTIONS:
#
# - This value is environment-specific AND host-specific
# - Mark the value as host specific in the environment variables by setting
#   the value to "HOST-SPECIFIC" , e.g. in `group_vars/env_dv1/vars.yml`
# - Set the host-specific value in the host variables of the virtual host of
#   the environment, e.g, `host_vars/sduace0101-dv1/vars.yml`
ibm_ace_environment_webadmin_ip: 10.51.35.72

# SSL certificate configuration
#
# What is the filename of the P12 certificate file?  What is its password?
# The certificate file should be in the source directory.
#
# HOST OVERRIDE CONVENTIONS:
#
# - This value is environment-specific AND host-specific
# - Mark the value as host specific in the environment variables by setting
#   the value to "HOST-SPECIFIC" , e.g. in `group_vars/env_dv1/vars.yml`
# - Set the host-specific value in the host variables of the virtual host of
#   the environment, e.g, `host_vars/sduace0101-dv1/vars.yml`
#
# VAULT NAMING CONVENTIONS:
#
# - `.ibm_ace_environment_cert_secret`
#
#   Use `vault_ibm_ace_cert_secret`
ibm_ace_environment_cert_p12: sduace0101.services.workcover.vic.gov.au.p12
ibm_ace_environment_cert_secret: "{{ vault_ibm_ace_cert_secret }}"

# Directories and symbolic links for the environment
#
# What directories and symbolic links are required by this ACE environment?
# The specifications comprise a list of objects that define the following
# keys:
#
# - `path` -- What is the absolute path of the directory to create?
# - `perm` -- What are the permissions of the directory?  An octal string
#   in the form `"0750"`.
# - `link` -- What is the path of a symbolic link to create pointing at
#   this directory?  (Optional)  When present, a symbolic link is created
#   at this path with `path` as its target.  Typically used to make
#   network-mounted directories accessible beneath `FILENODES_ROOT_DIR`
#   so that ACE file nodes can resolve paths relative to their configured
#   root directory.
#
# Use the following variables to parameterise path values to the host or
# environment:
#
# - `ibm_host_name` -- The hostname of the target host
# - `ibm_ace_environment` -- The environment identifier, e.g. `dv1`
# - `ibm_ace_environment_root_dir` -- The root directory name configured
#   for ACE file nodes, e.g. `FILENODES_ROOT_DIR` which typically already
#   includes `ibm_ace_environment`
ibm_ace_environment_directories:
  - path: "{{ ibm_ace_environment_root_dir }}/TPCBatch"
    perm: "0750"
  - path: "{{ ibm_ace_environment_root_dir }}/TPCBatch/Load"
    perm: "0750"
