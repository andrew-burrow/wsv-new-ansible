# This property file maps the connectivity of each queue manager
# in the cluster to the full repository that it should connect
# to.
#
# All queue managers defined in all clusters (i.e. all environments)
# are listed.

# MQREPOSLIST is an associative array using the actual queue manager
# name as the index. The value of the element is the name of the
# Full Repository queue manager in the CLUSSDR channel definition.
